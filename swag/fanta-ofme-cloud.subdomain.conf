## Version 2026/11/02
# Make sure that your fanta-ofme-cloud container is named "Fanta-OFME-Cloud" (or "fanta-ofme-cloud")
# and is on the same custom Docker network as SWAG (e.g. "proxynet"), OR replace $upstream_app
# with your Unraid LAN IP (e.g. set $upstream_app 192.168.1.100;).
#Make sure that your DNS has a CNAME set for "saves" (or your chosen subdomain).

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    # Change "saves.*" to whatever subdomain you want (e.g. fanta.*, cloud.*, saves.*)
    server_name saves.*;

    include /config/nginx/ssl.conf;

    # Allow large save game .zip uploads up to 512MB
    client_max_body_size 512M;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;

        # If on the same custom Docker network as SWAG, use container name in lowercase:
        set $upstream_app fanta-ofme-cloud;
        set $upstream_port 27845;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
